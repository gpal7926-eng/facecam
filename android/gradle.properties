# Project-wide Gradle settings for FaceCam.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Optional GPU filter path (MIT: org.wysaid:gpuimage-plus).
# Leave false for the default pure-CPU build. Set true (or pass
# -Pfacecam.gpuFilters=true) to bundle the OpenGL filter library.
facecam.gpuFilters=false
